services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acquisition_worker_test
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acquisition_worker_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-provider:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - ./mock_provider.py:/app/mock_provider.py:ro
    command: ["python", "mock_provider.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:8090/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker-test:
    build:
      context: ../../../../..
      dockerfile: docker/data-acquisition-worker/Dockerfile
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/acquisition_worker_test
      REDIS_URL: redis://redis-test:6379
      PYTHON_SERVICE_URL: http://mock-provider:8090
      ALPHAFLOW_INTERNAL_API_SECRET: dev-internal-secret
      DATA_ACQUISITION_WORKER_THREADS: "2"
      DATA_ACQUISITION_WORKER_QUEUE_CAPACITY: "4"
      DATA_ACQUISITION_WORKER_LEASE_SECONDS: "5"
      DATA_ACQUISITION_WORKER_HEARTBEAT_SECONDS: "1"
      DATA_ACQUISITION_WORKER_CLAIM_IDLE_MS: "2000"
      DATA_ACQUISITION_WORKER_REQUEST_TIMEOUT_MS: "12000"
      DATA_ACQUISITION_WORKER_MAX_ATTEMPTS: "3"
      DATA_ACQUISITION_RETRY_DELAYS_SECONDS: "1,1"
      DATA_ACQUISITION_WORKER_HEALTH_PORT: "8070"
      DATA_ACQUISITION_STREAM: homepage:data-acquisition-test
      DATA_ACQUISITION_GROUP: data-acquisition-worker-test
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8070/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
