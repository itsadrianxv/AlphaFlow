services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: homepage_worker_test
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homepage_worker_test"]
      interval: 1s
      timeout: 1s
      retries: 30
  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
  mock-web:
    image: python:3.12-alpine
    volumes:
      - ./mock_web.py:/app/mock_web.py:ro
    command: ["python", "/app/mock_web.py"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health/live"]
      interval: 1s
      timeout: 1s
      retries: 30
  worker-test:
    build:
      context: ../../../../..
      dockerfile: docker/homepage-worker/Dockerfile
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mock-web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-test:5432/homepage_worker_test
      REDIS_URL: redis://redis-test:6379
      ALPHAFLOW_WEB_INTERNAL_URL: http://mock-web:3001
      ALPHAFLOW_INTERNAL_API_SECRET: test-secret
      HOMEPAGE_WORKER_THREADS: 2
      HOMEPAGE_WORKER_QUEUE_CAPACITY: 2
      HOMEPAGE_WORKER_LEASE_SECONDS: 4
      HOMEPAGE_WORKER_HEARTBEAT_SECONDS: 1
      HOMEPAGE_WORKER_CLAIM_IDLE_MS: 1000
      HOMEPAGE_WORKER_REQUEST_TIMEOUT_MS: 10000
      HOMEPAGE_WORKER_HEALTH_PORT: 8050
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8050/health/ready"]
      interval: 1s
      timeout: 1s
      retries: 30
    stop_grace_period: 10s
