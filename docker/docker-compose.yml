services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-stock-screening-boost}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stock-screening-boost}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  python-service:
    build:
      context: ..
      dockerfile: docker/python/Dockerfile
      args:
        INSTALL_REFCHECKER: ${REFCHECKER_ENABLED:-false}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001}
      INTELLIGENCE_CACHE_TTL_SECONDS: ${INTELLIGENCE_CACHE_TTL_SECONDS:-300}
      INTELLIGENCE_CACHE_STALE_SECONDS: ${INTELLIGENCE_CACHE_STALE_SECONDS:-1800}
      INTELLIGENCE_SPOT_CACHE_TTL_SECONDS: ${INTELLIGENCE_SPOT_CACHE_TTL_SECONDS:-120}
      INTELLIGENCE_ENABLE_MOCK_FALLBACK: ${INTELLIGENCE_ENABLE_MOCK_FALLBACK:-true}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379}
      GATEWAY_REDIS_PREFIX: ${GATEWAY_REDIS_PREFIX:-gateway-cache}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-https://api.tushare.pro}
      MINISHARE_TOKEN: ${MINISHARE_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-15000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_BASE_URL: ${TAVILY_BASE_URL:-https://api.tavily.com}
      TAVILY_TIMEOUT_MS: ${TAVILY_TIMEOUT_MS:-15000}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      FIRECRAWL_TIMEOUT_MS: ${FIRECRAWL_TIMEOUT_MS:-15000}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_WEB_SEARCH_MODEL: ${ZHIPU_WEB_SEARCH_MODEL:-glm-4-plus}
      ZHIPU_WEB_SEARCH_ENDPOINT: ${ZHIPU_WEB_SEARCH_ENDPOINT:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
      ZHIPU_WEB_SEARCH_TIMEOUT_SECONDS: ${ZHIPU_WEB_SEARCH_TIMEOUT_SECONDS:-8}
      ZHIPU_WEB_SEARCH_RETRIES: ${ZHIPU_WEB_SEARCH_RETRIES:-2}
      REFCHECKER_ENABLED: ${REFCHECKER_ENABLED:-false}
      REFCHECKER_MODEL: ${REFCHECKER_MODEL:-}
      REFCHECKER_API_BASE: ${REFCHECKER_API_BASE:-}
      REFCHECKER_TIMEOUT_SECONDS: ${REFCHECKER_TIMEOUT_SECONDS:-20}
      REFCHECKER_BATCH_SIZE: ${REFCHECKER_BATCH_SIZE:-4}
      INTELLIGENCE_CONCEPT_CATALOG_FILE: ${INTELLIGENCE_CONCEPT_CATALOG_FILE:-/app/data/ths_concept_catalog.csv}
      INTELLIGENCE_THEME_CONCEPT_RULES_FILE: ${INTELLIGENCE_THEME_CONCEPT_RULES_FILE:-/data/theme-concept-rules/theme_concept_rules.json}
      SCREENING_STOCK_UNIVERSE_FILE: ${SCREENING_STOCK_UNIVERSE_FILE:-/app/data/screening_stock_universe.json}
    ports:
      - "${PYTHON_SERVICE_PORT:-8000}:8000"
    volumes:
      - ../python_services/app:/app/app
      - ../python_services/scripts:/app/scripts
      - ../temp:/app/temp
      - ../data:/app/data
      - python_theme_rules_data:/data/theme-concept-rules
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as r; r.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  kronos-service:
    build:
      context: ..
      dockerfile: docker/kronos/Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /opt/kronos
      WATCHFILES_FORCE_POLLING: "true"
      KRONOS_REPO_PATH: /opt/kronos
      KRONOS_MODEL_NAME: ${KRONOS_MODEL_NAME:-NeoQuasar/Kronos-base}
      KRONOS_TOKENIZER_NAME: ${KRONOS_TOKENIZER_NAME:-NeoQuasar/Kronos-Tokenizer-base}
      KRONOS_DEVICE: ${KRONOS_DEVICE:-auto}
      KRONOS_DEFAULT_PREDICTION_LENGTH: ${KRONOS_DEFAULT_PREDICTION_LENGTH:-60}
      KRONOS_MAX_CONTEXT: ${KRONOS_MAX_CONTEXT:-512}
      KRONOS_TIMEOUT_MS: ${KRONOS_TIMEOUT_MS:-120000}
      HF_HOME: ${HF_HOME:-/models/huggingface}
    ports:
      - "${KRONOS_SERVICE_PORT:-8010}:8010"
    volumes:
      - ../python_services/kronos_service:/app/kronos_service
      - kronos_model_cache:/models/huggingface
      - ../.models/Kronos:/opt/kronos:ro
      - ../.models/huggingface:/models/huggingface
    command:
      ["uvicorn", "kronos_service.app:app", "--host", "0.0.0.0", "--port", "8010", "--reload", "--reload-dir", "/app/kronos_service"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as r; r.urlopen('http://localhost:8010/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 20

  agent-runtime:
    build:
      context: ..
      dockerfile: docker/agent-runtime/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: "8020"
      ALPHAFLOW_WEB_INTERNAL_URL: ${ALPHAFLOW_WEB_INTERNAL_URL:-http://web:3000}
      ALPHAFLOW_INTERNAL_API_SECRET: ${ALPHAFLOW_INTERNAL_API_SECRET:-dev-internal-secret}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SCHEDULED_TASK_EVENT_STREAM: ${SCHEDULED_TASK_EVENT_STREAM:-scheduled-task:events}
      SCHEDULED_TASK_EVENT_MAXLEN: ${SCHEDULED_TASK_EVENT_MAXLEN:-10000}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python-service:8000}
      PYTHON_SERVICE_TIMEOUT_MS: ${PYTHON_SERVICE_TIMEOUT_MS:-60000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT_RUNTIME_MODEL_PROVIDER: ${AGENT_RUNTIME_MODEL_PROVIDER:-deepseek}
      AGENT_RUNTIME_MODEL_ID: ${AGENT_RUNTIME_MODEL_ID:-deepseek-v4-flash}
      AGENT_RUNTIME_MODEL_TIMEOUT_MS: ${AGENT_RUNTIME_MODEL_TIMEOUT_MS:-120000}
      AGENT_RUNTIME_MAX_TOOL_CALLS: ${AGENT_RUNTIME_MAX_TOOL_CALLS:-12}
      AGENT_RUNTIME_TOOL_TIMEOUT_MS: ${AGENT_RUNTIME_TOOL_TIMEOUT_MS:-60000}
      AGENT_RUNTIME_SESSION_ROOT: ${AGENT_RUNTIME_SESSION_ROOT:-/data/agent-runtime/sessions}
      AGENT_RUNTIME_COMPACTION_TOKEN_THRESHOLD: ${AGENT_RUNTIME_COMPACTION_TOKEN_THRESHOLD:-48000}
    ports:
      - "${AGENT_RUNTIME_PORT:-8020}:8020"
    volumes:
      - ../agent_runtime:/repo/agent_runtime
      - ../web:/repo/web:ro
      - agent_runtime_node_modules:/repo/agent_runtime/node_modules
      - agent_runtime_sessions:/data/agent-runtime/sessions
    command: ["npm", "run", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  screening-worker:
    build:
      context: ..
      dockerfile: docker/screening-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-stock-screening-boost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python-service:8000}
      SCREENING_WORKER_THREADS: ${SCREENING_WORKER_THREADS:-4}
      SCREENING_WORKER_QUEUE_CAPACITY: ${SCREENING_WORKER_QUEUE_CAPACITY:-8}
      SCREENING_WORKER_LEASE_SECONDS: ${SCREENING_WORKER_LEASE_SECONDS:-90}
      SCREENING_WORKER_HEARTBEAT_SECONDS: ${SCREENING_WORKER_HEARTBEAT_SECONDS:-30}
      SCREENING_WORKER_CLAIM_IDLE_MS: ${SCREENING_WORKER_CLAIM_IDLE_MS:-120000}
      SCREENING_WORKER_PYTHON_TIMEOUT_MS: ${SCREENING_WORKER_PYTHON_TIMEOUT_MS:-900000}
      SCREENING_WORKER_HEALTH_PORT: ${SCREENING_WORKER_HEALTH_PORT:-8030}
      SCREENING_RUN_STREAM: ${SCREENING_RUN_STREAM:-screening:runs}
      SCREENING_RUN_GROUP: ${SCREENING_RUN_GROUP:-screening-worker}
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8030/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  definitive-task-worker:
    build:
      context: ..
      dockerfile: docker/definitive-task-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-stock-screening-boost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python-service:8000}
      DEFINITIVE_TASK_WORKER_THREADS: ${DEFINITIVE_TASK_WORKER_THREADS:-4}
      DEFINITIVE_TASK_WORKER_QUEUE_CAPACITY: ${DEFINITIVE_TASK_WORKER_QUEUE_CAPACITY:-8}
      DEFINITIVE_TASK_WORKER_LEASE_SECONDS: ${DEFINITIVE_TASK_WORKER_LEASE_SECONDS:-90}
      DEFINITIVE_TASK_WORKER_HEARTBEAT_SECONDS: ${DEFINITIVE_TASK_WORKER_HEARTBEAT_SECONDS:-30}
      DEFINITIVE_TASK_WORKER_CLAIM_IDLE_MS: ${DEFINITIVE_TASK_WORKER_CLAIM_IDLE_MS:-120000}
      DEFINITIVE_TASK_WORKER_PYTHON_TIMEOUT_MS: ${DEFINITIVE_TASK_WORKER_PYTHON_TIMEOUT_MS:-900000}
      DEFINITIVE_TASK_WORKER_HEALTH_PORT: ${DEFINITIVE_TASK_WORKER_HEALTH_PORT:-8040}
      DEFINITIVE_TASK_RUN_STREAM: ${DEFINITIVE_TASK_RUN_STREAM:-definitive-task:runs}
      DEFINITIVE_TASK_RUN_GROUP: ${DEFINITIVE_TASK_RUN_GROUP:-definitive-task-worker}
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8040/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        SKIP_ENV_VALIDATION: "1"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
      kronos-service:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_SECRET_1: ${AUTH_SECRET_1:-}
      AUTH_SECRET_2: ${AUTH_SECRET_2:-}
      AUTH_SECRET_3: ${AUTH_SECRET_3:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXTAUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_WECHAT_ID: ${AUTH_WECHAT_ID:-}
      AUTH_WECHAT_SECRET: ${AUTH_WECHAT_SECRET:-}
      AUTH_QQ_ID: ${AUTH_QQ_ID:-}
      AUTH_QQ_SECRET: ${AUTH_QQ_SECRET:-}
      AUTH_CREDENTIALS_USERNAME: ${AUTH_CREDENTIALS_USERNAME:-admin}
      AUTH_CREDENTIALS_PASSWORD: ${AUTH_CREDENTIALS_PASSWORD:-admin123456}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-stock-screening-boost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python-service:8000}
      PYTHON_SERVICE_TIMEOUT_MS: ${PYTHON_SERVICE_TIMEOUT_MS:-60000}
      PYTHON_INTELLIGENCE_SERVICE_URL: ${PYTHON_INTELLIGENCE_SERVICE_URL:-http://python-service:8000}
      PYTHON_INTELLIGENCE_SERVICE_TIMEOUT_MS: ${PYTHON_INTELLIGENCE_SERVICE_TIMEOUT_MS:-300000}
      KRONOS_SERVICE_URL: ${KRONOS_SERVICE_URL:-http://kronos-service:8010}
      KRONOS_SERVICE_TIMEOUT_MS: ${KRONOS_SERVICE_TIMEOUT_MS:-120000}
      AGENT_RUNTIME_URL: ${AGENT_RUNTIME_URL:-http://agent-runtime:8020}
      AGENT_RUNTIME_TIMEOUT_MS: ${AGENT_RUNTIME_TIMEOUT_MS:-300000}
      ALPHAFLOW_INTERNAL_API_SECRET: ${ALPHAFLOW_INTERNAL_API_SECRET:-dev-internal-secret}
      SCHEDULED_TASK_DELIVERY_TARGETS_JSON: ${SCHEDULED_TASK_DELIVERY_TARGETS_JSON:-[]}
      SELL_SIDE_REFRESH_SECRET: ${SELL_SIDE_REFRESH_SECRET:-}
      KRONOS_FORECAST_ENABLED: ${KRONOS_FORECAST_ENABLED:-false}
      KRONOS_DEFAULT_PREDICTION_LENGTH: ${KRONOS_DEFAULT_PREDICTION_LENGTH:-60}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../web:/repo/web
      - ../data:/repo/data:ro
      - web_node_modules:/repo/web/node_modules
      - web_next:/repo/web/.next
    command:
      [
        "sh",
        "-c",
        "npx prisma generate && npm run validate:runtime && npm run db:push -- --accept-data-loss && npm run dev",
      ]

  workflow-worker:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        SKIP_ENV_VALIDATION: "1"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
      kronos-service:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_SECRET_1: ${AUTH_SECRET_1:-}
      AUTH_SECRET_2: ${AUTH_SECRET_2:-}
      AUTH_SECRET_3: ${AUTH_SECRET_3:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-stock-screening-boost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python-service:8000}
      PYTHON_SERVICE_TIMEOUT_MS: ${PYTHON_SERVICE_TIMEOUT_MS:-60000}
      PYTHON_INTELLIGENCE_SERVICE_URL: ${PYTHON_INTELLIGENCE_SERVICE_URL:-http://python-service:8000}
      PYTHON_INTELLIGENCE_SERVICE_TIMEOUT_MS: ${PYTHON_INTELLIGENCE_SERVICE_TIMEOUT_MS:-300000}
      KRONOS_SERVICE_URL: ${KRONOS_SERVICE_URL:-http://kronos-service:8010}
      KRONOS_SERVICE_TIMEOUT_MS: ${KRONOS_SERVICE_TIMEOUT_MS:-120000}
      AGENT_RUNTIME_URL: ${AGENT_RUNTIME_URL:-http://agent-runtime:8020}
      AGENT_RUNTIME_TIMEOUT_MS: ${AGENT_RUNTIME_TIMEOUT_MS:-300000}
      ALPHAFLOW_INTERNAL_API_SECRET: ${ALPHAFLOW_INTERNAL_API_SECRET:-dev-internal-secret}
      KRONOS_FORECAST_ENABLED: ${KRONOS_FORECAST_ENABLED:-false}
      KRONOS_DEFAULT_PREDICTION_LENGTH: ${KRONOS_DEFAULT_PREDICTION_LENGTH:-60}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      WORKFLOW_WORKER_POLL_INTERVAL_MS: ${WORKFLOW_WORKER_POLL_INTERVAL_MS:-2000}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-10}
      WORKFLOW_NODE_TIMEOUT_MS: ${WORKFLOW_NODE_TIMEOUT_MS:-600000}
    volumes:
      - ../web:/repo/web
      - ../data:/repo/data:ro
      - web_node_modules:/repo/web/node_modules
      - web_next:/repo/web/.next
    command:
      ["sh", "-c", "npm run validate:runtime && npm run worker:workflow"]

  scheduler:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        SKIP_ENV_VALIDATION: "1"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-stock-screening-boost}
      AGENT_RUNTIME_URL: ${AGENT_RUNTIME_URL:-http://agent-runtime:8020}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python-service:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ALPHAFLOW_INTERNAL_API_SECRET: ${ALPHAFLOW_INTERNAL_API_SECRET:-dev-internal-secret}
      SCHEDULED_TASK_EVENT_STREAM: ${SCHEDULED_TASK_EVENT_STREAM:-scheduled-task:events}
      SCHEDULED_TASK_EVENT_GROUP: ${SCHEDULED_TASK_EVENT_GROUP:-scheduler}
      SCHEDULED_TASK_EVENT_BLOCK_MS: ${SCHEDULED_TASK_EVENT_BLOCK_MS:-5000}
      SCHEDULED_TASK_EVENT_CLAIM_IDLE_MS: ${SCHEDULED_TASK_EVENT_CLAIM_IDLE_MS:-60000}
      SCHEDULED_TASK_EVENT_BATCH_SIZE: ${SCHEDULED_TASK_EVENT_BATCH_SIZE:-20}
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-5000}
      SCHEDULER_CONCURRENCY: ${SCHEDULER_CONCURRENCY:-4}
      SCHEDULED_TASK_DELIVERY_TARGETS_JSON: ${SCHEDULED_TASK_DELIVERY_TARGETS_JSON:-[]}
      FEISHU_WEBHOOK_URL_RESEARCH_ALERTS: ${FEISHU_WEBHOOK_URL_RESEARCH_ALERTS:-}
      SCHEDULED_TASK_DELIVERY_STUCK_MS: ${SCHEDULED_TASK_DELIVERY_STUCK_MS:-300000}
    volumes:
      - ../web:/repo/web
      - web_node_modules:/repo/web/node_modules
    command: ["sh", "-c", "npx prisma generate && npm run worker:scheduler"]
volumes:
  postgres_data:
  redis_data:
  python_theme_rules_data:
  kronos_model_cache:
  web_node_modules:
  web_next:
  agent_runtime_node_modules:
  agent_runtime_sessions:


